name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: '部署目標：preview = github.io 草稿預覽；production = 自訂網域上線'
        type: choice
        options:
          - preview
          - production
        default: preview

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        # postbuild script runs pagefind automatically (see package.json)
        # 草稿階段：push-to-main 預設 'preview'（github.io 草稿，不寫 CNAME）。
        # 買網址後上線：把下面的 'preview' 改成 'production'（＝SOP 的「換一個參數就上線」），
        # 屆時 push-to-main 會寫入 dist/CNAME=ginny.me 切到自訂網域。
        # workflow_dispatch 仍可隨時手動選 preview / production。
        env:
          DEPLOY_TARGET: ${{ github.event.inputs.deploy_target || 'preview' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
